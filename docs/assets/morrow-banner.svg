<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Morrow — A calmer space for AI</title>
  <desc id="desc">A dark midnight-blue banner with cyan and violet aurora ribbons, orbital rings, and Morrow wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B1B"/>
      <stop offset=".55" stop-color="#101A36"/>
      <stop offset="1" stop-color="#16102B"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2=".2">
      <stop offset="0" stop-color="#27D9FF" stop-opacity="0"/>
      <stop offset=".32" stop-color="#27D9FF" stop-opacity=".42"/>
      <stop offset=".68" stop-color="#8C72FF" stop-opacity=".46"/>
      <stop offset="1" stop-color="#B36CFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".6" stop-color="#DAF7FF"/>
      <stop offset="1" stop-color="#BEB4FF"/>
    </linearGradient>
    <radialGradient id="glowA">
      <stop offset="0" stop-color="#1BCFFF" stop-opacity=".28"/>
      <stop offset="1" stop-color="#1BCFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0" stop-color="#9B6DFF" stop-opacity=".25"/>
      <stop offset="1" stop-color="#9B6DFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <circle cx="205" cy="30" r="235" fill="url(#glowA)"/>
  <circle cx="1050" cy="275" r="300" fill="url(#glowB)"/>
  <path d="M-50 255 C170 160 330 350 590 245 S995 90 1250 170 L1250 340 L-50 340Z" fill="url(#aurora)" filter="url(#soft)"/>
  <path d="M-40 268 C180 185 320 324 575 248 S980 118 1240 190" stroke="#4EDFFF" stroke-opacity=".28" stroke-width="1.5" fill="none"/>
  <path d="M-40 282 C190 198 355 340 610 263 S1005 136 1240 207" stroke="#A88CFF" stroke-opacity=".3" stroke-width="1.5" fill="none"/>
  <g opacity=".6" fill="#D8F7FF">
    <circle cx="73" cy="75" r="1.7"/><circle cx="121" cy="222" r="1.1"/><circle cx="300" cy="53" r="1.2"/>
    <circle cx="405" cy="105" r="1.4"/><circle cx="693" cy="54" r="1.2"/><circle cx="789" cy="256" r="1.3"/>
    <circle cx="1030" cy="72" r="1.5"/><circle cx="1111" cy="130" r="1.1"/><circle cx="1145" cy="258" r="1.7"/>
    <circle cx="954" cy="35" r="1.1"/><circle cx="557" cy="43" r="1.2"/><circle cx="259" cy="282" r="1.3"/>
  </g>
  <g transform="translate(150 160)">
    <circle r="64" fill="#0B1830" stroke="#4ADCF5" stroke-opacity=".52" stroke-width="1.5"/>
    <circle r="47" fill="none" stroke="#9886FF" stroke-opacity=".65" stroke-width="1.3" stroke-dasharray="3 8"/>
    <ellipse rx="54" ry="22" transform="rotate(-35)" fill="none" stroke="#38D9FF" stroke-opacity=".85" stroke-width="2"/>
    <ellipse rx="54" ry="22" transform="rotate(35)" fill="none" stroke="#A78BFA" stroke-opacity=".85" stroke-width="2"/>
    <circle r="10" fill="#ECFBFF"/>
    <circle cx="40" cy="-31" r="4" fill="#65E5FF"/>
    <circle cx="-37" cy="35" r="3.5" fill="#B69AFF"/>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="255" y="145" font-size="64" font-weight="750" letter-spacing="8" fill="url(#wordmark)">MORROW</text>
    <text x="260" y="187" font-size="19" font-weight="500" letter-spacing="2" fill="#BFD0F6">A CALMER SPACE TO THINK, CREATE &amp; EXPLORE</text>
    <rect x="260" y="215" width="246" height="34" rx="17" fill="#FFFFFF" fill-opacity=".06" stroke="#6ADFF8" stroke-opacity=".35"/>
    <circle cx="278" cy="232" r="4" fill="#5CE5F8"/>
    <text x="291" y="237" font-size="12" font-weight="600" letter-spacing="1.3" fill="#E2F8FF">NATIVE ANDROID · KOTLIN</text>
  </g>
</svg>