
name: Build Morrow APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug and release APKs
        run: gradle assembleDebug assembleRelease

      - name: Sign release APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          SDK="${ANDROID_HOME}/build-tools"
          APKSIGNER="$(find "$SDK" -name apksigner -type f | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$SDK" -name zipalign -type f | sort -V | tail -n 1)"

          test -f "$APK"
          test -n "$APKSIGNER"
          test -n "$ZIPALIGN"

          KEYSTORE="$RUNNER_TEMP/morrow-release.jks"

          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storepass "${{ secrets.MORROW_KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.MORROW_KEY_PASSWORD }}" \
            -alias morrow \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Morrow, O=Morrow"

          "$ZIPALIGN" -f -p 4 "$APK" "$RUNNER_TEMP/morrow-aligned.apk"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias morrow \
            --ks-pass "pass:${{ secrets.MORROW_KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.MORROW_KEY_PASSWORD }}" \
            --out app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/morrow-aligned.apk"

          "$APKSIGNER" verify --verbose \
            app/build/outputs/apk/release/app-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Morrow-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Morrow-release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
