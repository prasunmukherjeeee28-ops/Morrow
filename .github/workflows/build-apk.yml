
name: Build Morrow APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Verify APK signature and manifest
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"
          SDK="${ANDROID_HOME}/build-tools"

          APKSIGNER="$(find "$SDK" -name apksigner -type f | sort -V | tail -n 1)"
          AAPT="$(find "$SDK" -name aapt -type f | sort -V | tail -n 1)"

          test -f "$APK"
          test -n "$APKSIGNER"
          test -n "$AAPT"

          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | head -n 8

          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Morrow-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Morrow-build-diagnostics
          path: |
            app/build/outputs/apk/debug/output-metadata.json
            app/build/outputs/logs/
          if-no-files-found: ignore
